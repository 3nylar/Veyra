# Publish the documentation site to GitHub Pages.
#
# Documentation ONLY. The wallet interface is deliberately not deployed — it
# talks to an API on localhost, and an HTTPS page cannot call http://127.0.0.1
# (mixed content). See scripts/build-site.ts.
#
# The API is never deployed anywhere. It holds private keys in memory.

name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Refuse to publish if a secret is tracked. Publishing is not reversible:
      # forks and caches persist, and scrapers watch new public repos.
      - name: Pre-publish secret check
        run: npm run check:publish

      - run: npm run docs:build
      - run: npm run site:build

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
